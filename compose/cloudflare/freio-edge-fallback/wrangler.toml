name = "freio-edge-fallback"
main = "worker.mjs"
compatibility_date = "2026-08-12"
compatibility_flags = ["global_fetch_private_origin"]

# Deliberate deployment interlock: uploading the Worker cannot expose it.
# Production routes are attached only by the separately reviewed runbook.
workers_dev = false
preview_urls = false

[observability]
enabled = false
