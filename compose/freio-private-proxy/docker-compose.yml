name: freio-private-proxy

services:
  proxy:
    image: traefik@sha256:a9890c898f379c1905ee5b28342f6b408dc863f08db2dab20e46c267d1ff463a
    container_name: freio-private-proxy
    restart: unless-stopped
    command:
      - --global.sendanonymoususage=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.ping.address=:8080
      - --ping=true
      - --ping.entrypoint=ping
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - 127.0.0.1:9443:443
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /etc/dokploy/traefik/dynamic/freio-private-certs/certificates:/certs:ro
    networks:
      - dokploy-network
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  dokploy-network:
    external: true
