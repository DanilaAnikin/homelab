# Telegram credential values never belong in this file. Alertmanager 0.33 reads
# both values from root-managed bind mounts at runtime.
global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, severity]
  group_wait: 1m
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: [severity = info]
      receiver: telegram
      repeat_interval: 24h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/credentials/telegram-token
        chat_id_file: /run/credentials/telegram-chat-id
        parse_mode: ""
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🛑{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}{{ if .CommonLabels.severity }} [{{ .CommonLabels.severity }}]{{ end }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}
          {{ end }}{{ end }}

inhibit_rules:
  - source_matchers: [severity = kriticke]
    target_matchers: [severity = varovani]
    equal: [alertname]
