# Homelab observability — metriky (Prometheus+exportéry), logy (Loki+Promtail),
# dashboardy (Grafana). Mimo Dokploy, na dokploy-network. UI: homelab.grafana (Tailscale).
services:
  obs-prometheus:
    image: prom/prometheus:latest
    container_name: obs-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.retention.time=30d","--web.enable-lifecycle"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - obs-prometheus-data:/prometheus
    networks: [dokploy-network]
    restart: unless-stopped

  obs-alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    container_name: obs-alertmanager
    profiles: [telegram]
    # The host credentials stay 0600 root:root. Root in this unprivileged
    # container can read the two read-only binds; all Linux capabilities are
    # still removed and the host filesystem is not otherwise exposed.
    user: "0:0"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - type: bind
        source: /etc/homelab-telegram/telegram-token
        target: /run/credentials/telegram-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/homelab-telegram/telegram-chat-id
        target: /run/credentials/telegram-chat-id
        read_only: true
        bind:
          create_host_path: false
      - obs-alertmanager-data:/alertmanager
    networks: [dokploy-network]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    ulimits:
      core: 0

  obs-node-exporter:
    image: prom/node-exporter:latest
    container_name: obs-node-exporter
    command: ["--path.rootfs=/host","--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    networks: [dokploy-network]
    restart: unless-stopped

  obs-cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: obs-cadvisor
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [dokploy-network]
    restart: unless-stopped

  obs-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: obs-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "${PG_EXPORTER_DSN}"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    networks: [dokploy-network]
    restart: unless-stopped

  obs-blackbox:
    image: prom/blackbox-exporter:latest
    container_name: obs-blackbox
    volumes: ["./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"]
    networks: [dokploy-network]
    restart: unless-stopped

  obs-loki:
    image: grafana/loki:latest
    container_name: obs-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - obs-loki-data:/loki
    networks: [dokploy-network]
    restart: unless-stopped

  obs-promtail:
    image: grafana/promtail:latest
    container_name: obs-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dokploy-network]
    restart: unless-stopped

  obs-grafana:
    image: grafana/grafana:latest
    container_name: obs-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      GF_SERVER_ROOT_URL: "http://homelab.grafana"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - obs-grafana-data:/var/lib/grafana
    networks: [dokploy-network]
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
volumes:
  obs-prometheus-data:
  obs-alertmanager-data:
  obs-loki-data:
  obs-grafana-data:
