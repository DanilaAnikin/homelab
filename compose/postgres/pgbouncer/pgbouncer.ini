;; PgBouncer pro sdílený Postgres — transaction pooling (jako Supabase :6543).
;; Aplikace: postgres://user:pass@shared-pgbouncer:6432/dbname
;; Pozn.: transaction mode nepodporuje prepared statements na úrovni session —
;;        Prisma: přidej ?pgbouncer=true; migrace pouštěj přes direct :5432.

[databases]
* = host=shared-postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer
auth_query = SELECT username, password FROM pgbouncer.get_auth($1)

pool_mode = transaction
max_client_conn = 500
default_pool_size = 5
reserve_pool_size = 2
max_db_connections = 8
server_idle_timeout = 300
ignore_startup_parameters = extra_float_digits,search_path

admin_users = pgbouncer
