# The high-priority router sends apex/www through a secretless request-aware
# gateway. The gateway proxies the primary and synthesizes a safe response
# before any primary 5xx/connection failure can reach the visitor.
http:
  middlewares:
    freio-public-read-retry:
      retry:
        attempts: 2
        initialInterval: 50ms

  routers:
    freio-public-read-gateway:
      rule: >-
        (Host(`freio.cz`) || Host(`www.freio.cz`)) &&
        (Method(`GET`) || Method(`HEAD`))
      priority: 31000
      service: freio-public-gateway
      entryPoints: [web]
      middlewares: [freio-public-read-retry]
    freio-public-write-gateway:
      rule: Host(`freio.cz`) || Host(`www.freio.cz`)
      priority: 30000
      service: freio-public-gateway
      entryPoints: [web]

  services:
    freio-public-gateway:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /healthz
          interval: 2s
          timeout: 1s
          hostname: freio.cz
        servers:
          - url: http://freio-public-gateway-a:8080
          - url: http://freio-public-gateway-b:8080
