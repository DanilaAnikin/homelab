networks:
  dokploy-network:
    external: true
  postiz-internal:
    driver: bridge
volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres:
  postiz-redis:
services:
  postiz:
    image: postiz-freio:patched
    pull_policy: never
    container_name: postiz
    restart: unless-stopped
    mem_limit: 1700m
    env_file: /srv/postiz/postiz.env
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks: [dokploy-network, postiz-internal]
    depends_on: [postiz-postgres, postiz-redis]
  postiz-postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: postiz-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: f6459bbf4898d5e99d98c1ceb99ac366
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres:/var/lib/postgresql/data
    networks: [postiz-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 10
  postiz-redis:
    image: redis:7.2@sha256:6372db89351b00ba0ddca437ff49ce2ed4beed8a961a27d8259060c9603c240d
    container_name: postiz-redis
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - postiz-redis:/data
    networks: [postiz-internal]
  postiz-temporal:
    image: temporalio/auto-setup:1.25.2@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
    container_name: postiz-temporal
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postiz-postgres
      - POSTGRES_USER=postiz
      - POSTGRES_PWD=f6459bbf4898d5e99d98c1ceb99ac366
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true
    networks: [postiz-internal]
    depends_on: [postiz-postgres]
