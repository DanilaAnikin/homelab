# postiz.freio.cz — ochrana přes CLOUDFLARE ACCESS (Zero Trust), gate na CF edge.
# Traefik jen proxuje na Postiz; login (e-mail OTP) řeší CF Access. /uploads má v CF
# Access bypass (veřejné pro sociální sítě). Jediný veřejný vstup je CF tunel → CF Access
# je jediná brána. (Aktivováno 2026-08-10, nahrazuje Tailscale-only ipAllowList.)
http:
  routers:
    postiz:
      rule: Host(`postiz.freio.cz`)
      priority: 10000
      service: postiz-public
      entryPoints: [web]
  services:
    postiz-public:
      loadBalancer:
        servers:
          - url: http://postiz:5000
        passHostHeader: true
